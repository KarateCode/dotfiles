# Workmux configuration for envoy-web
# Worktrees are created in ~/code/envoy-web__worktrees/

base_branch: develop

# Place worktrees in a sibling directory (without the "-base" suffix)
worktree_dir: ../envoy-web__worktrees

# Use just the last part of branch names (e.g., "EP-1234" from "feature/EP-1234")
worktree_naming: basename

files:
  symlink:
    - .opencode

  # Copy files that may need per-worktree modifications
  copy:
    - shared/config-overrides.js

# Commands to run after creating a new worktree
post_create:
  - '[ -e .claude ] && [ ! -L .claude ] && { echo "refusing: .claude is a real directory, not a symlink" >&2; exit 1; }; ln -sfn "$HOME/code/claude" .claude'
  - mise install
  - npm run install-dev
