# Prefix
# set -g prefix C-Space
set -g prefix ^W
set -g prefix2 C-a
# bind -N "Send prefix" C-Space send-prefix

# switch panes using Alt-arrow without prefix
unbind C-Left
unbind C-Right
unbind C-Up
unbind C-Down
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

set -g mouse on

bind C-h select-pane -L
bind C-l select-pane -R
bind C-k select-pane -U
bind C-j select-pane -D

unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind c new-window -c ~

# Smart Alt+Shift+F — move or extend forward by word
bind -T copy-mode M-F run-shell 'tmux if -F "#{selection_active}" "send -X next-word-end" "send -X begin-selection; send -X next-word"'
bind -T copy-mode M-B run-shell 'tmux if -F "#{selection_active}" "send -X previous-word" "send -X begin-selection; send -X previous-word"'
bind -T copy-mode C-g send -X cancel

# prefix; C-r to enter search up
bind C-r copy-mode \; run-shell "tmux send -t \"#{pane_id}\" C-r"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on # recount when a window is closed

unbind -T copy-mode MouseDragEnd1Pane
bind -T copy-mode MouseDragEnd1Pane send -X stop-selection
unbind -T copy-mode MouseUp2Pane
bind -T copy-mode MouseUp2Pane send -X stop-selection

# Home → jump to history top
bind -n Home if-shell -F '#{pane_in_mode}' \
    'send-keys -X history-top' \
    'run "tmux copy-mode; tmux send-keys -X history-top"'
# End → jump to history bottom
bind -n End if-shell -F '#{pane_in_mode}' \
    'send-keys -X history-bottom' \
    'run "tmux copy-mode; tmux send-keys -X history-bottom"'

# PageUp  (Ctrl-Shift-K)
bind -n C-S-i if -F "#{pane_in_mode}" \
    "send -X page-up" \
    "copy-mode -e \; send -X page-up"

# PageDown  (Ctrl-Shift-L)
bind -n C-S-k if -F "#{pane_in_mode}" \
    "send -X page-down" \
    "copy-mode -e \; send -X page-down"

# Home (jump to top)  (Ctrl-Shift-H)
bind -n C-S-h if -F "#{pane_in_mode}" \
    'send-keys -X history-top' \
    'run "tmux copy-mode; tmux send-keys -X history-top"'

# --- Pane resizing -------------------------------------------------------
# These used to be `bind -n C-S-u` etc. and silently never fired. A terminal
# cannot encode Shift on a control character (C-o is the byte 0x0f; there is
# no bit left for shift), so tmux literally could not tell C-S-o from C-o --
# it was reaching bash as readline's operate-and-get-next instead.
#
# The protocol answer (extended-keys + the `extkeys` terminal feature) does
# get negotiated with Ghostty, but Ghostty still replies with legacy
# encodings, so it does not help. Instead Ghostty is configured to emit
# unambiguous private sequences and we match those literally here.
#
# Paired with ~/.config/ghostty/config:
#   ctrl+shift+u -> \x1b[124;9z      ctrl+shift+y -> \x1b[126;9z
#   ctrl+shift+o -> \x1b[125;9z      ctrl+shift+, -> \x1b[127;9z
# Keep the two sides in sync; a mismatch just makes the key do nothing.
set -s user-keys[0] "\e[124;9z"
set -s user-keys[1] "\e[125;9z"
set -s user-keys[2] "\e[126;9z"
set -s user-keys[3] "\e[127;9z"

# Shrink pane width (Ctrl-Shift-U)
bind -n User0 resize-pane -L 5

# Grow pane width (Ctrl-Shift-O)
bind -n User1 resize-pane -R 5

# Make pane taller (Ctrl-Shift-Y)
bind -n User2 resize-pane -U 5

# Make pane shorter (Ctrl-Shift-Comma)
bind -n User3 resize-pane -D 5

# Normal copy-mode C-k
bind -T copy-mode C-k \
    send -X begin-selection \; \
    send -X end-of-line \; \
    send -X copy-selection-and-cancel

# Config and help
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

