# keyd per-application overrides, consumed by `keyd-application-mapper`.
#
# IMPORTANT: this file MUST live at ~/.config/keyd/app.conf. The path is
# hardcoded in /usr/bin/keyd-application-mapper:
#     CONFIG_PATH = os.getenv('HOME')+'/.config/keyd/app.conf'
# It does NOT fall back to /etc/keyd/app.conf. A copy used to sit in
# /etc/keyd/ instead, so the user service died on every boot with
#     ERROR: could not find app.conf, make sure it is in ~/.config/keyd/app.conf
# (5 restart attempts, then start-limit-hit) -- which is what produced the
# red Omarchy notification at login, and meant none of the mappings below
# were ever active.
#
# Symlink it into place with:
#   mkdir -p ~/.config/keyd
#   ln -s ~/dotfiles/keyd/app.conf ~/.config/keyd/app.conf
#
# The mapper also writes app.lock and app.log next to it in ~/.config/keyd/,
# so check ~/.config/keyd/app.log when debugging.
#
# Section headers are window CLASS names. Discover them with:
#   keyd-application-mapper -v          # logs the active window as you focus
# On Hyprland the `wlroots` backend is used (Hyprland is wlroots-based);
# `hyprctl activewindow` is another way to read the class.
#
# `cmd` here is the layer defined in /etc/keyd/default.conf, where
# leftmeta = layer(cmd) and leftcontrol = leftmeta -- i.e. the physical key in
# the macOS Cmd position. CapsLock is the real Ctrl (capslock = rightcontrol).

# Terminal applications need Ctrl+Shift for copy/paste
[alacritty]
cmd.c = C-S-c
cmd.v = C-S-v

[com-mitchellh-ghostty]
cmd.c = C-S-c
cmd.v = C-S-v
cmd.t = C-S-t
cmd.w = C-S-w
cmd.leftbrace = C-S-tab
cmd.rightbrace = C-tab

# cmd+k -> clear tmux pane. Needs a chord Ghostty can distinguish: the [cmd:C]
# layer makes plain Cmd+K arrive as Ctrl+K, which would eat kill-line.
cmd.k = C-A-k

# cmd+d must not stay C-d: Emacs binds that to `my/delete-or-region'.
# F9 is \e[20~, which init.el's input-decode-map turns into [cmd-d]
# -> `duplicate-line', same as on the Mac. Real C-d is still capslock+d.
cmd.d = f9

# Left Ctrl + W must close the tab even with a text field focused.
#
# The GTK "Emacs" key theme (gsettings org.gnome.desktop.interface gtk-key-theme,
# set by ~/dotfiles/omarchy/hooks/post-boot.d/gtk-emacs-keys.hook) rebinds
# <ctrl>w inside text entries:
#     /usr/share/themes/Emacs/gtk-3.0/gtk-keys.css:69
#     bind "<ctrl>w" { "delete-from-cursor" (word-ends, -1) };
# Chromium honours that, so in a text box Ctrl+W deletes a word instead of
# closing the tab -- and both Ctrl keys emit an identical Ctrl+W, so nothing
# downstream can tell them apart.
#
# Ctrl+F4 is Chromium's other close-tab accelerator and the Emacs key theme
# does not bind it, so it reaches Chromium untouched in every context.
# Scoped to [chromium], so C-w in terminals, Emacs and tmux is unaffected.
[chromium]
cmd.w = C-f4

# Cmd+Shift+H -> "open the home page in the current tab", same as on the Mac.
#
# Chromium on Linux spells that accelerator Alt+Home and has no Ctrl+Shift+H
# binding at all (that chord is macOS-only), so nothing is being shadowed here.
# The home button itself is hidden by default, which is why the mouse route
# needed chrome://settings/appearance and the keyboard had no route at all --
# this laptop has no Home key and the Moonlander has none mapped.
#
# Alt+Home reaches Chromium untouched: Hyprland only grabs Home with SUPER
# (restore window width) and SUPER+ALT (save window width), never with plain
# ALT. Check with `hyprctl binds -j` before assuming that still holds.
#
# Requires the [cmd+shift] composite layer in /etc/keyd/default.conf. Without
# it keyd rejects this line with "cmd+shift is not a valid layer" and the
# mapper silently drops the whole [chromium] section.
cmd+shift.h = A-home

# Cmd+Left / Cmd+Right -> browser back / forward, matching the Mac, where
# Chrome binds these natively. Chromium on Linux spells them Alt+Left and
# Alt+Right. Both are free in Hyprland -- the only arrow grabs are SUPER
# combos plus the CTRL+ALT+Left/Right Chromium tab binds in
# ~/dotfiles/hypr/bindings.lua. Re-check with `hyprctl binds -j`.
#
# No composite layer needed (plain `cmd` layer), unlike cmd+shift.h above.
#
# CAVEAT -- this differs from the Mac on purpose, know the tradeoff:
# macOS Chrome makes Cmd+Left context-sensitive (start-of-line inside a text
# field, Back everywhere else). keyd matches on window class only and cannot
# see whether a text field has focus, so here it is ALWAYS Back -- including
# mid-edit in a form. Chrome dropped Backspace-as-back over this exact
# footgun; Alt+Left still navigates out of a focused text box.
# Word-left/right inside Chromium is still available on capslock+arrow,
# which is the real Ctrl (capslock = rightcontrol in /etc/keyd/default.conf).
#
# DO NOT remove the [cmd+alt] composite layer from /etc/keyd/default.conf.
# keyd layer precedence is coarse -- these [cmd] bindings fire even when Alt
# is also held, so without that layer Cmd+Alt+Left/Right (Chromium tab
# navigation) gets rewritten to Alt+Left/Right and goes Back/Forward instead.
# The empty composite layer wins over [cmd] and passes Cmd+Alt+arrow through
# as Ctrl+Alt+arrow, which is what the Chromium tab binds in
# ~/dotfiles/hypr/bindings.lua grab.
cmd.left = A-left
cmd.right = A-right

# Cmd+Alt+Left / Cmd+Alt+Right -> Chromium tab navigation, as on the Mac.
#
# These MUST be spelled out. Declaring an empty [cmd+alt] composite layer is
# not enough to shield the chord: with no binding for `left` on the composite
# layer, keyd falls through to [cmd] and fires `cmd.left = A-left` anyway, so
# Cmd+Alt+Left went Back instead of switching tabs. An explicit binding here
# is what actually wins.
#
# C-A-left/right is a passthrough of what the chord would have produced on its
# own -- it hands Ctrl+Alt+Left/Right to Hyprland, whose Chromium tab binds in
# ~/dotfiles/hypr/bindings.lua forward Ctrl+Page_Up / Ctrl+Page_Down to the
# window. Hyprland stays the single owner of tab navigation; this just stops
# keyd eating the keys before they get there.
cmd+alt.left = C-A-left
cmd+alt.right = C-A-right
